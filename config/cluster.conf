# Short blocks make tail stripes observable in the examples.
block_bytes = 8
staging_limit = 67108864
# Bytes per node withheld from foreground PUT/multipart writes for heal and
# rebalance. A node may override this with an optional sixth comma field.
maintenance_reserve = 0

# id, failure domain, media, fragment capacity (bytes), initial state[, reserve]
node = hot-a, az1, hot, 67108864, online
node = hot-b, az2, hot, 67108864, online
node = hot-c, az3, hot, 67108864, online
node = hot-d, az1, hot, 67108864, online
node = hot-e, az4, hot, 67108864, online

node = cap-a, az1, capacity, 134217728, online
node = cap-b, az2, capacity, 134217728, online
node = cap-c, az3, capacity, 134217728, online
